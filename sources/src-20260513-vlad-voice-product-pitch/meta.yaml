notes: |
  Это **продуктовая визия от первого лица** — Влад дословно проговаривает что,
  для кого, как, по какой цене и в каком формате он продаёт AI-Маркетолога Потока 2.
  Это **высший приоритет среди seed-документов** — содержит:
  - Биографический контекст ("в одно рыло закрывал", "стал тем человеком, которого искал")
  - Точную сегментацию ЦА (3 типа + 4 уровень распознавания)
  - 7 блоков программы (vs 8 модулей на сайте — конфликт!)
  - Формат: "каждую неделю выход модуля в записи + 1 воркшоп" (vs 2 стрима/нед в seed — конфликт!)
  - Цены: $297 / $647 (контент+чат+куратор+Q&A) / $800 = $647 + $300 за стратсессию (vs $997 на сайте + конфликт!)
  - Стратсессия отдельно $700, но "отказываюсь от продаж" — фокус на доплате $300
  - 3 кейса прикольных продуктов: дофаминомика, агент автобзвона, гиперперсонализированные медитации
  - Признание "сейчас тестовый режим, программу запускал в тестовом, в полторы недели делаю выпускной 1 потока"
