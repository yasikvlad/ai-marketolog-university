notes: |
  Это **полный первоисточник реальной программы Потока 2** — то, что фактически
  преподавалось, в отличие от плановых ТЗ. Передан Владом 2026-06-03 для проектирования
  структуры Потока 3. Изучен детально (5 параллельных агентов, ~2.3 МБ текста).

  Главное, что подтверждено первоисточником (важно для структуры Потока 3):

  1. РЕАЛЬНЫЙ ПОРЯДОК: Настройка (ВШ№1) → Deep Research (ВШ№2) → Цифровые сотрудники
     (ВШ№3) → Упаковка (ВШ№4) → Лендинги (ВШ№5) → Контент (ВШ№6). Внеклассно: Визуал
     (Женя), Карусели (Света). Бонус/премиум (вне базы): агенты/автоматизация (Серёжа),
     своё приложение, AI-таргет.

  2. ЦИФРОВЫЕ СОТРУДНИКИ ИДУТ ПОСЛЕ DEEP RESEARCH (а не до). Прямой принцип Влада:
     «сначала ручками понять причинно-следственные связи и провести research → потом
     автоматизировать повторяющееся в скиллы → потом агенты». Deep Research = фундамент-хаб,
     к которому потом «стучатся» нейронки-сотрудники за данными. Зависимость «до упаковки
     надо знать сотрудников» выполняется: сотрудники (ВШ№3) идут перед упаковкой (ВШ№4).

  3. ИЕРАРХИЯ AI-СОТРУДНИКОВ (урок Skills): Claude Project (ассистент) → Skill
     (skill-creator) → MCP-коннектор → Plugin → Agent. Агенты (автономные, на сервере,
     по расписанию/routines) Влад явно выносит в бонус/премиум, НЕ в базовый курс.

  4. ПЕДАГОГИКА: база = «20%, дающие 80%». Антиперфекционизм («продай деньги, не
     выдрачивай дизайн»). Один сегмент / одна боль / один продукт / одна фича.
     Рефрейминг продукта в услугу/промежуточный шаг (диагностика, прогноз, калькулятор).

  5. ГЛАВНЫЕ ЗАТЫКИ УЧЕНИКОВ (учесть в онбординге Потока 3): первичная настройка Claude
     (Git/Homebrew/permissions), деплой Vercel+GitHub (403/токены), установка скиллов
     (локальные vs облачные), хаос с хранением результатов, постановка правильной задачи
     этапу, копирайтинг «видно что AI» (→ humanizer-ru), FOMO/забегание вперёд.
