notes: |
  Это **главный продающий артефакт Потока 2** — вебинар, который Влад провёл сам.
  Пик 200+ онлайн-зрителей, в финале ~73 человека. На вебинаре в течение ~10 минут
  поступило 10+ оплат — «золотой дождь» работает.

  Уникальная ценность источника — Влад **обнажает свою механику запуска**:
  - как он удерживает внимание 2-3 часа («конкурирую с TikTok»)
  - как делает live-демо на реальной участнице (Аня — трудоустройство в Германии)
  - как раскрывает оффер и пакеты в реальном времени
  - как использует партнёра-инженера (Сергей Евсюков) для усиления тех. доверия
  - как подключает социальные доказательства (Виорика, София Дробинина, Андрей Полозовский, Макс Паникар, Артём)

  Этот файл — primary source для извлечения «формулы вебинара Влада» (пользовательский
  запрос 2026-05-18). См. notes/n-webinar-formula-*.

  Также фиксирует:
  - Личная storyline: 1 апреля → нужны деньги на завтра → нейронка предложила анонсировать
    тестовый формат + сделать AI-продавца → +1 000$/день уходом из ручной работы.
  - Анонсирована новая программа «AI-Таргетинг» (следующий продукт)
  - Канал оплаты «Золотой дождь» — отдельный TG-канал с уведомлениями о платежах
  - Пакет «Куколд» $250 закрывается после потока, далее минимум $500/$600
  - Анонсирован новый пакет «Менторство фокус-группа» (5 человек)
